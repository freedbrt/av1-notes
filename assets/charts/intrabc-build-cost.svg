<text x="18.0" y="42" class="viz-ink2" font-size="12">CRC32C hashing</text>
<rect x="127.4" y="32" width="12" height="12" rx="2" class="viz-s2"/>
<text x="145.4" y="42" class="viz-ink2" font-size="12">Table insert</text>
<rect x="242.6" y="32" width="12" height="12" rx="2" class="viz-s3"/>
<text x="260.6" y="42" class="viz-ink2" font-size="12">Table free</text>
