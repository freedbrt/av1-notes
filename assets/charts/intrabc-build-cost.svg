<svg class="viz" viewBox="0 0 720 204" width="100%" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif" aria-labelledby="bc-title bc-desc">
<title id="bc-title">Hash table build per key frame, IDE and video clip, M3 Pro, 1 thread</title>
<desc id="bc-desc">Stacked bars. Before, CRC32C hashing takes 12.6 ms, table insert 30.4 ms and table free 6.4 ms. After, CRC32C hashing takes 12.4 ms, table insert 8.6 ms and nothing is freed.</desc>
