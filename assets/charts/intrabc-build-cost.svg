<text x="409.6" y="178" class="viz-muted" font-size="12" text-anchor="middle">30</text>
<line x1="524.8" y1="72" x2="524.8" y2="160" class="viz-grid" stroke-width="1"/>
<text x="524.8" y="178" class="viz-muted" font-size="12" text-anchor="middle">40</text>
<line x1="640.0" y1="72" x2="640.0" y2="160" class="viz-grid" stroke-width="1"/>
<text x="640.0" y="178" class="viz-muted" font-size="12" text-anchor="middle">50</text>
<text x="640.0" y="196" class="viz-muted" font-size="12" text-anchor="end">ms per key frame</text>
